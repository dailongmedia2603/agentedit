appId: app.autocapcut.desktop
# Ten hien thi (goi .app, Dock, menu). Ten NOI BO `name` trong package.json giu "auto-capcut": Electron
# dung no cho thu muc du lieu (~/Library/Application Support/auto-capcut: khoa API da ma hoa) va muc
# Keychain "auto-capcut Safe Storage" — doi thi mat khoa API da luu.
productName: Agent Edit
copyright: Copyright © 2026 Agent Edit

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - "!out/remotion-bundle/**"
  - package.json
  # GramJS (npm `telegram`, tai file > 20 MB cua bot Telegram, 2026-10-24) la devDependency DA GOI vao out/main; 2 goi native
  # no keo theo (bufferutil / utf-8-validate) lot vao cay phu thuoc cua ws (peer tuy chon) -> loai, ws tu chay ban JS.
  - "!node_modules/bufferutil/**"
  - "!node_modules/utf-8-validate/**"

# Khong co mo-dun native nao can bien dich lai cho Electron (2 goi tren da loai)
npmRebuild: false

# Sidecar Python DA BIEN DICH (Cython -> .so): scripts/compile-sidecar.mjs tao resources/sidecar-dist
# (chi con .so + launcher + scripts wrapper + assets/references), ship thay cho source .py.
extraResources:
  - from: resources/sidecar-dist
    to: sidecar
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"

  # PYTHON NHUNG (python-build-standalone) — scripts/bundle-python.mjs tao resources/python.
  # Nguoi dung KHONG cai Python rieng; sidecar chay bang chinh interpreter nay.
  - from: resources/python
    to: python

  # FFMPEG + FFPROBE NHUNG (zip ghim SHA) — scripts/bundle-ffmpeg.mjs. Doctor giai nen tu day,
  # may moi khong phai tai GitHub (tung loi "SHA-256 khong khop" khi mang chap chon).
  - from: resources/ffmpeg
    to: ffmpeg

  # Trang web Remotion da dong goi san (npm run build -> out/remotion-bundle). Nam NGOAI
  # app.asar vi trinh duyet headless doc no qua may chu http cua Remotion.
  - from: out/remotion-bundle
    to: remotion-bundle

  # SKILL motionmaxxing ("Tao video" + "Automation Video", 2026-10-14) — de nguyen chu (Claude doc). Lan dau chay ban
  # moi, electron/services/motion/skill.ts chep ra ~/.capcut-studio/motion/skill/<phien-ban> -> cap nhat app la cap nhat skill.
  - from: skills/motionmaxxing
    to: skills/motionmaxxing
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/__pycache__/**"

  # motion-video-director v3.5.2 — user xac nhan quyen phan phoi rieng 2026-10-20.
  # Cap nhat app cung cap nhat skill; giu LICENSE.md va thong tin tac gia trong goi.
  - from: skills/motion-video-director
    to: skills/motion-video-director
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/__pycache__/**"
      - "!**/*.pyc"

# Sau khi dong goi app (da nhet Python nhung + .so): ad-hoc ky SAU toan bo -> tranh loi "bi hong"
# tren may tai ve (identity:null lam electron-builder bo qua ky -> seal khong khop Resources moi). Chi macOS
# (hook tu bo qua tren Windows; afterAllArtifactBuild chi xu ly file .dmg).
afterPack: scripts/adhoc-sign.cjs
# Sau khi build xong: gan icon logo cho chinh file .dmg (dmg.icon chi dat icon cho dia khi mount)
afterAllArtifactBuild: scripts/dmg-seticon.cjs

asar: true
# Binary cua Remotion (compositor + ffmpeg + dylib) phai nam ngoai asar moi chay duoc;
# electron/remotion-worker.ts tro `binariesDirectory` vao app.asar.unpacked.
asarUnpack:
  - node_modules/@remotion/compositor-*/**

mac:
  category: public.app-category.video
  # Kien truc do scripts/dist.mjs chon (--arm64 tren Apple Silicon, --x64 tren Mac Intel — 2026-10-12): khong ghi arch
  # o day de 1 cau hinh dung cho ca 2 ban. Ban x64 ra release/mac/, arm64 ra release/mac-arm64/ (scripts/mac-app-path.mjs).
  target:
    - target: dmg
  # ma build (scripts/dist.mjs) trong ten file -> nhan ra ngay ban nao
  artifactName: ${productName}-${version}-b${env.STUDIO_BUILD_ID}-${arch}.${ext}
  darkModeSupport: true
  # Khong co Apple Developer cert -> ad-hoc ky, khong notarize: khach mo lan dau bi Gatekeeper chan, lam theo
  # huong dan ve tren nen DMG + file "Hướng dẫn mở lần đầu.txt" (xem dmg: ben duoi)
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Khong su dung microphone.
    NSCameraUsageDescription: Khong su dung camera.

# ---------------------------------------------------------------------------------------------------
# WINDOWS (x64) — build TREN may Windows (`npm run dist:win`, xem BUILD-WINDOWS.md): bytenode .jsc khoa theo V8
# + CPU, Cython .pyd can MSVC -> khong build cheo tu macOS duoc.
# ---------------------------------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-b${env.STUDIO_BUILD_ID}-${arch}.${ext}
  # Cai cho RIENG nguoi dung (khong can quyen admin) -> app chay quyen thuong
  requestedExecutionLevel: asInvoker
  # Chua co chung chi ky ma (Authenticode) -> SmartScreen bao "Windows protected your PC" lan dau
  # (bam "More info" -> "Run anyway"). Co chung chi thi them signtoolOptions / azureSignOptions o day.
  extraResources:
    # Model thi giac may ONNX nhung san (scripts/bundle-models.mjs): tach nguoi, tim mat, OCR — thay Apple Vision
    - from: resources/models
      to: models

nsis:
  oneClick: false
  # %LOCALAPPDATA%\Programs\Agent Edit — khong can admin, app tu ghi duoc (Doctor cai cong cu vao ~/.capcut-studio)
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Agent Edit
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages:
    - vi_VN
  language: '1066'
  # Go cai dat KHONG xoa du lieu nguoi dung (khoa API da ma hoa, du an, kho SFX / meme o ~/.capcut-studio)
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-b${env.STUDIO_BUILD_ID}-${arch}.${ext}

dmg:
  title: ${productName}
  # Icon cua chinh file .dmg + icon o dia khi mount = logo app (build/icon.icns)
  icon: build/icon.icns
  # ma build (scripts/dist.mjs) trong ten file -> nhan ra ngay ban nao
  artifactName: ${productName}-${version}-b${env.STUDIO_BUILD_ID}-${arch}.${ext}
  # Nen cua so = build/background.png (+@2x), 660x480, ve HUONG DAN MO LAN DAU: app chua notarize ->
  # Gatekeeper chan, khach phai bam "Xong" roi "Vẫn mở" trong Quyen rieng tu & Bao mat (macOS 15+ bo
  # chuot phai > Open). Sua chu: build/dmg/background.html -> node scripts/make-dmg-background.mjs.
  # Toa do x/y la TAM icon, phai khop cac o chua trong san tren nen.
  contents:
    - x: 170
      y: 150
      type: file
    - x: 490
      y: 150
      type: link
      path: /Applications
    - x: 574
      y: 380
      type: file
      path: dmg/huong-dan-mo-lan-dau.txt
      name: Hướng dẫn mở lần đầu.txt
