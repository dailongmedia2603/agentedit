<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý key · Agent Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F3; --panel:#fff; --ink:#1a1c22; --ink2:#5b5f6b; --ink3:#9a9ea8; --line:#ece6df;
  --brand:#F2620A; --brand-soft:#FFF1E6; --ok:#0f9d58; --ok-soft:#E7F6EE; --warn:#b26a00; --warn-soft:#FFF4DC;
  --bad:#d93025; --bad-soft:#FDECEA; --mute-soft:#F1F2F4; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#FFB070,var(--brand));display:grid;place-items:center;color:#fff;font-weight:700}
header h1{font-size:18px;margin:0}
header .who{margin-left:auto;color:var(--ink2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .15s}
.stat:hover,.stat.on{border-color:var(--brand)}
.stat .n{font-size:22px;font-weight:700}
.stat .l{color:var(--ink2);font-size:12px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;cursor:pointer}
.seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;background:var(--mute-soft)}
.btn.primary{background:var(--brand);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%;margin-top:14px}
.created{margin-top:14px;border:1px dashed var(--brand);border-radius:12px;padding:10px;background:var(--brand-soft);display:none}
.created .row{display:flex;align-items:center;gap:8px;padding:4px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px}
.created .mono{flex:1;font-weight:600}
.copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;cursor:pointer;font-size:12px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500}
.tabs button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#FFFAF5}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-warn{background:var(--warn-soft);color:var(--warn)} .b-mute{background:var(--mute-soft);color:var(--ink2)}
.sub{color:var(--ink3);font-size:12px}
.empty{color:var(--ink3);text-align:center;padding:30px}
.drawer-bg{position:fixed;inset:0;background:rgba(20,20,25,.35);display:none;z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:11;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:20px}
.drawer.open{transform:none} .drawer-bg.open{display:block}
.drawer h3{margin:0 0 4px;font-size:17px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;margin:12px 0}
.kv div:nth-child(odd){color:var(--ink2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ev{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.ev .t{font-weight:600}
.inline{display:flex;gap:8px;align-items:end}
.inline>*{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;display:none;z-index:20}
.hide{display:none}
@media (max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">A</div>
    <h1>Quản lý key · Agent Edit</h1>
    <div class="who" id="who"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <div class="card">
      <h2>Tạo key mới</h2>
      <label>Gói</label>
      <div class="seg" id="plan">
        <button data-v="month" class="on">Tháng</button>
        <button data-v="year">Năm</button>
        <button data-v="lifetime">Vĩnh viễn</button>
      </div>
      <div class="sub" style="margin-top:6px">Hạn dùng tính từ ngày khách kích hoạt.</div>
      <label>Số lượng</label>
      <input id="count" type="number" min="1" max="100" value="1">
      <label>Tên khách</label>
      <input id="customer" placeholder="VD: Nguyễn Văn A">
      <label>Liên hệ (SĐT / Zalo / email)</label>
      <input id="contact">
      <label>Ghi chú</label>
      <textarea id="note" placeholder="VD: chuyển khoản 12/10, mã GD ..."></textarea>
      <button class="btn primary full" id="create">Tạo key</button>
      <div class="created" id="created"></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button data-tab="keys" class="on">Danh sách key</button>
        <button data-tab="events">Nhật ký</button>
      </div>
      <div id="tab-keys">
        <div class="toolbar">
          <input id="q" placeholder="Tìm theo key, tên khách, liên hệ, tên máy…">
          <select id="status" style="width:auto">
            <option value="">Tất cả</option>
            <option value="active">Đang dùng được</option>
            <option value="unused">Chưa kích hoạt</option>
            <option value="locked">Bị khoá</option>
            <option value="expired">Hết hạn</option>
            <option value="conflict">Có máy khác thử dùng</option>
          </select>
        </div>
        <table>
          <thead><tr><th>Key</th><th>Khách</th><th>Gói</th><th>Trạng thái</th><th class="hide-sm">Hết hạn</th><th class="hide-sm">Máy</th><th class="hide-sm">Lần dùng cuối</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="tab-events" class="hide"></div>
    </div>
  </div>
</div>

<div class="drawer-bg" id="dbg"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const PLAN = { month: 'Tháng', year: 'Năm', lifetime: 'Vĩnh viễn' }
const EV = {
  activate_new: 'Kích hoạt lần đầu', activate: 'Kích hoạt (cùng máy)', rekey: 'Cài lại trên cùng máy', check: 'Mở app / phân tích video',
  library: 'Đồng bộ kho', other_machine: 'MÁY KHÁC thử dùng key', reject_locked: 'Bị chặn: key đã khoá', reject_expired: 'Bị chặn: hết hạn',
  auto_lock: 'TỰ KHOÁ', admin_create: 'Tạo key', admin_lock: 'Quản trị khoá', admin_unlock: 'Quản trị mở khoá', admin_reset: 'Quản trị reset máy',
  admin_extend: 'Gia hạn', admin_set_expiry: 'Đặt ngày hết hạn', admin_update: 'Sửa thông tin'
}
const fmtDate = (ms) => (ms ? new Date(ms).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '')
const fmtTime = (ms) => (ms ? new Date(ms).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' }) : '')
const osName = (p) => (p === 'darwin' ? 'Mac' : p === 'win32' ? 'Windows' : '')

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'x-admin': '1', ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  })
  const j = await r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }))
  if (!j.ok) throw new Error(j.error || 'Lỗi')
  return j
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), 2200)
}
async function copy(text) { await navigator.clipboard.writeText(text); toast('Đã sao chép') }

function statusOf(l) {
  if (l.status === 'locked') return ['Bị khoá', 'b-bad']
  if (l.expires_at && l.expires_at <= Date.now()) return ['Hết hạn', 'b-warn']
  if (!l.bound && !l.activated_at) return ['Chưa kích hoạt', 'b-mute']
  if (!l.bound) return ['Chờ gán máy', 'b-mute']
  return ['Đang dùng', 'b-ok']
}

// ---------- Thong ke ----------
async function loadStats() {
  const { stats: s } = await api('/api/stats')
  const items = [['', 'Tổng key', s.total], ['active', 'Đang dùng', s.in_use], ['unused', 'Chưa kích hoạt', s.unused],
    ['locked', 'Bị khoá', s.locked], ['expired', 'Hết hạn', s.expired], ['conflict', 'Máy khác thử dùng', s.conflict]]
  $('#stats').innerHTML = items.map(([v, l, n]) =>
    `<div class="stat ${$('#status').value === v ? 'on' : ''}" data-v="${v}"><div class="n">${n || 0}</div><div class="l">${l}</div></div>`).join('')
  document.querySelectorAll('.stat').forEach((el) => (el.onclick = () => { $('#status').value = el.dataset.v; loadList() }))
}

// ---------- Danh sach ----------
let qTimer
async function loadList() {
  const q = $('#q').value.trim(), st = $('#status').value
  const { licenses } = await api(`/api/licenses?q=${encodeURIComponent(q)}&status=${st}`)
  $('#rows').innerHTML = licenses.length ? licenses.map((l) => {
    const [label, cls] = statusOf(l)
    return `<tr class="click" data-id="${l.id}">
      <td class="mono">…${esc(l.key_hint)}</td>
      <td>${esc(l.customer) || '<span class="sub">—</span>'}${l.contact ? `<div class="sub">${esc(l.contact)}</div>` : ''}</td>
      <td>${PLAN[l.plan]}</td>
      <td><span class="badge ${cls}">${label}</span>${l.conflicts ? ` <span class="badge b-warn" title="Số lần máy khác thử dùng">⚠ ${l.conflicts}</span>` : ''}</td>
      <td class="hide-sm">${l.plan === 'lifetime' ? 'Không hạn' : l.expires_at ? fmtDate(l.expires_at) : '<span class="sub">từ lúc kích hoạt</span>'}</td>
      <td class="hide-sm">${l.bound ? `${osName(l.platform)}<div class="sub">${esc(l.hostname)}</div>` : '<span class="sub">—</span>'}</td>
      <td class="hide-sm sub">${fmtTime(l.last_seen_at)}</td></tr>`
  }).join('') : '<tr><td colspan="7" class="empty">Chưa có key nào</td></tr>'
  document.querySelectorAll('tr.click').forEach((tr) => (tr.onclick = () => openLicense(tr.dataset.id)))
  loadStats()
}

// ---------- Tao key ----------
let plan = 'month'
document.querySelectorAll('#plan button').forEach((b) => (b.onclick = () => {
  plan = b.dataset.v
  document.querySelectorAll('#plan button').forEach((x) => x.classList.toggle('on', x === b))
}))
$('#create').onclick = async () => {
  const btn = $('#create'); btn.disabled = true
  try {
    const { created } = await api('/api/licenses', {
      plan, count: Number($('#count').value) || 1, customer: $('#customer').value, contact: $('#contact').value, note: $('#note').value
    })
    const box = $('#created')
    box.style.display = 'block'
    box.innerHTML = `<div style="display:flex;align-items:center;margin-bottom:6px"><b>Đã tạo ${created.length} key (${PLAN[plan]})</b>
      ${created.length > 1 ? '<button class="copy" id="copyAll" style="margin-left:auto">Sao chép tất cả</button>' : ''}</div>` +
      created.map((c) => `<div class="row"><span class="mono">${esc(c.key)}</span><button class="copy" data-k="${esc(c.key)}">Sao chép</button></div>`).join('')
    box.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => copy(b.dataset.k)))
    const all = $('#copyAll'); if (all) all.onclick = () => copy(created.map((c) => c.key).join('\n'))
    $('#customer').value = ''; $('#contact').value = ''; $('#note').value = ''; $('#count').value = 1
    loadList()
  } catch (e) { toast(e.message) } finally { btn.disabled = false }
}

// ---------- Chi tiet 1 key ----------
function closeDrawer() { $('#drawer').classList.remove('open'); $('#dbg').classList.remove('open') }
$('#dbg').onclick = closeDrawer

async function openLicense(id) {
  try { renderDrawer(await api('/api/licenses/' + id)) } catch (e) { toast(e.message) }
}
function renderDrawer({ license: l, events }) {
  const [label, cls] = statusOf(l)
  const d = $('#drawer')
  d.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px"><h3>${esc(l.customer) || 'Key'}</h3><span class="badge ${cls}">${label}</span>
      <button class="btn" style="margin-left:auto" id="xClose">Đóng</button></div>
    <div class="card" style="margin-top:12px;display:flex;align-items:center;gap:8px">
      <span class="mono" style="flex:1;font-size:15px;font-weight:600">${esc(l.key)}</span><button class="copy" id="cpKey">Sao chép</button></div>
    ${l.status === 'locked' && l.locked_reason ? `<div class="card" style="margin-top:10px;background:var(--bad-soft);border-color:#f6c9c4">Lý do khoá: ${esc(l.locked_reason)}</div>` : ''}
    <div class="kv">
      <div>Gói</div><div>${PLAN[l.plan]}</div>
      <div>Hết hạn</div><div>${l.plan === 'lifetime' ? 'Không hạn' : l.expires_at ? fmtDate(l.expires_at) : 'Tính từ lúc kích hoạt'}</div>
      <div>Kích hoạt lúc</div><div>${fmtTime(l.activated_at) || '—'}</div>
      <div>Máy đang gán</div><div>${l.bound ? `${osName(l.platform)} · ${esc(l.hostname)} · app v${esc(l.app_version)}` : '—'}</div>
      <div>Lần dùng cuối</div><div>${fmtTime(l.last_seen_at) || '—'}${l.last_ip ? ` <span class="sub">${esc(l.last_ip)} ${esc(l.last_country)}</span>` : ''}</div>
      <div>Máy khác thử dùng</div><div>${l.conflicts ? `<b style="color:var(--warn)">${l.conflicts} lần</b>` : '0'}</div>
      <div>Liên hệ</div><div>${esc(l.contact) || '—'}</div>
      <div>Ghi chú</div><div style="white-space:pre-wrap">${esc(l.note) || '—'}</div>
      <div>Tạo lúc</div><div>${fmtTime(l.created_at)}</div>
    </div>
    <div class="actions">
      ${l.status === 'locked' ? '<button class="btn ok" data-a="unlock">Mở khoá</button>' : '<button class="btn danger" data-a="lock">Khoá key</button>'}
      ${l.bound ? '<button class="btn" data-a="reset">Reset máy (cho đổi máy)</button>' : ''}
      ${!l.activated_at && !l.bound ? '<button class="btn danger" data-a="delete">Xoá key</button>' : ''}
    </div>
    <div class="card">
      <h2>Gia hạn / đổi gói</h2>
      <div class="inline">
        <div><label>Gói</label><select id="exPlan">${Object.entries(PLAN).map(([k, v]) => `<option value="${k}" ${k === l.plan ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div><label>Số kỳ</label><input id="exTimes" type="number" min="1" max="10" value="1"></div>
        <button class="btn primary" data-a="extend">Gia hạn</button>
      </div>
      <div class="inline" style="margin-top:4px">
        <div><label>Hoặc đặt ngày hết hạn</label><input id="exDate" type="date" value="${l.expires_at ? new Date(l.expires_at).toISOString().slice(0, 10) : ''}"></div>
        <button class="btn" data-a="set_expiry">Lưu ngày</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>Thông tin khách</h2>
      <label>Tên khách</label><input id="edCustomer" value="${esc(l.customer)}">
      <label>Liên hệ</label><input id="edContact" value="${esc(l.contact)}">
      <label>Ghi chú</label><textarea id="edNote">${esc(l.note)}</textarea>
      <button class="btn full" data-a="update">Lưu thông tin</button>
    </div>
    <h2 style="font-size:15px;margin:18px 0 6px">Lịch sử</h2>
    ${events.length ? events.map((e) => `<div class="ev"><span class="t" style="${/other_machine|auto_lock/.test(e.type) ? 'color:var(--bad)' : ''}">${EV[e.type] || esc(e.type)}</span>
      <span class="sub"> · ${fmtTime(e.at)} ${esc(e.ip || '')} ${esc(e.country || '')}</span>${e.detail ? `<div class="sub">${esc(e.detail)}</div>` : ''}</div>`).join('') : '<div class="sub">Chưa có</div>'}
  `
  d.classList.add('open'); $('#dbg').classList.add('open')
  $('#xClose').onclick = closeDrawer
  $('#cpKey').onclick = () => copy(l.key)
  d.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => act(l, b.dataset.a)))
}

async function act(l, a) {
  let body = {}
  if (a === 'lock') {
    const reason = prompt('Lý do khoá key (khách không thấy lý do này):', 'Vi phạm điều khoản / chia sẻ key')
    if (reason === null) return
    body = { reason }
  } else if (a === 'reset') {
    if (!confirm('Gỡ key khỏi máy đang gán? Khách sẽ nhập lại key trên máy mới. Hạn dùng giữ nguyên.')) return
  } else if (a === 'delete') {
    if (!confirm('Xoá hẳn key chưa kích hoạt này?')) return
  } else if (a === 'extend') {
    body = { plan: $('#exPlan').value, times: Number($('#exTimes').value) || 1 }
    if (!confirm(`Gia hạn thêm ${body.times} kỳ gói ${PLAN[body.plan]}?`)) return
  } else if (a === 'set_expiry') {
    const v = $('#exDate').value
    body = { expires_at: v ? new Date(v + 'T23:59:59').getTime() : null }
  } else if (a === 'update') {
    body = { customer: $('#edCustomer').value, contact: $('#edContact').value, note: $('#edNote').value }
  }
  try {
    const r = await api(`/api/licenses/${l.id}/${a}`, body)
    if (r.deleted) { closeDrawer(); toast('Đã xoá') } else { renderDrawer(r); toast('Đã lưu') }
    loadList()
  } catch (e) { toast(e.message) }
}

// ---------- Nhat ky chung ----------
async function loadEvents() {
  const { events } = await api('/api/events')
  $('#tab-events').innerHTML = events.length ? events.map((e) => `<div class="ev" data-id="${e.license_id || ''}" style="cursor:pointer">
    <span class="t" style="${/other_machine|auto_lock/.test(e.type) ? 'color:var(--bad)' : ''}">${EV[e.type] || esc(e.type)}</span>
    <span class="sub"> · ${esc(e.customer || '')} …${esc(e.key_hint || '')} · ${fmtTime(e.at)} ${esc(e.ip || '')} ${esc(e.country || '')}</span>
    ${e.detail ? `<div class="sub">${esc(e.detail)}</div>` : ''}</div>`).join('') : '<div class="empty">Chưa có</div>'
  document.querySelectorAll('#tab-events .ev').forEach((el) => (el.onclick = () => el.dataset.id && openLicense(el.dataset.id)))
}
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b))
  $('#tab-keys').classList.toggle('hide', b.dataset.tab !== 'keys')
  $('#tab-events').classList.toggle('hide', b.dataset.tab !== 'events')
  if (b.dataset.tab === 'events') loadEvents()
}))

$('#q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(loadList, 250) }
$('#status').onchange = loadList
api('/api/me').then((r) => ($('#who').textContent = r.email)).catch(() => {})
loadList().catch((e) => toast(e.message))
</script>
</body>
</html>
